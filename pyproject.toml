[project]
name = "dlss5-neural-rendering"
description = "Experimental ComfyUI node for applying NVIDIA DLSS 5 Neural Rendering to images and video."
version = "0.1.0"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "transformers>=4.45",
    "huggingface-hub>=0.24",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/aiplatforms-ru/ComfyUI-DLSS5-Neural-Rendering"
Documentation = "https://github.com/aiplatforms-ru/ComfyUI-DLSS5-Neural-Rendering#readme"
Issues = "https://github.com/aiplatforms-ru/ComfyUI-DLSS5-Neural-Rendering/issues"

[tool.comfy]
PublisherId = "aiplatforms-ru"
DisplayName = "DLSS 5 Neural Rendering"


